spring.application.name=login
server.port=${PORT:8083}

# Database Configuration (Supports Environment Variables on Render)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-249d58a8-heshanchanuka7-8fe3.h.aivencloud.com:15979/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false

# Explicit Dialect to prevent "Unable to determine Dialect without JDBC metadata" error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MVC and Security Configuration
spring.main.allow-circular-references=true
